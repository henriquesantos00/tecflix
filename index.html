<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecFlix</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>OS MELHORES CANTOS</header>

    <main>
        <h1>Os melhores cantos de pássaros</h1>
        <p>O canto da curicaca.</p>

        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/v3VugdB6OKw?si=H85glmFo2OAYRodw" title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>


        <section class="canto-araponga-amazonia">
            <div class="araponga-amazonia-texto">
                <h2>O Canto da Araponga da Amazônia</h2>
            </div>


            <a href="https://www.youtube.com/watch?v=6IRg2iJRovA" target="_blank" rel="noopener noreferrer">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6mxIhc8eF4RYgGoY0js9O2tNp8n8rYURysSWS-GmzzQ&s=10"
                    alt="Som de Araponga-da-Amazônia" class="amazonia-imagem">
            </a>
        </section>

        <section class="canto-urutau">
            <div class="urutau-texto">
                <h2>O Canto do Urutau</h2>
            </div>


            <a href="https://www.youtube.com/watch?v=fZL66zpxU-g" target="_blank" rel="noopener noreferrer">

                <img src="urutau.png" alt="Som de Urutau"
                    class="urutau-imagem">

            </a>
        </section>

    </main>

</body>

</html>
